<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <article>
    <header>
      <h2>서블릿 인자전달 연습</h2>
    </header>
    <form action="/MyServlet3" method="post">
      친구1:<input type="text" name="m_name"/><br/>
      친구2:<input type="text" name="m_name"/><br/>
      친구3:<input type="text" name="m_name"/><br/>
      친구4:<input type="text" name="m_name"/><br/>
      친구5:<input type="text" name="m_name"/><br/>
      <button type="button" onclick="exe(this.form)">보내기</button> <!--버튼안에 폼-->
    </form>
  </article>
<script>
  function exe(frm) { //인자를 frm로 받는다.(현재 frm은 폼을 가진다.)
    console.log("exe 함수 시작!");
    //유효성 검사
    let names = document.getElementsByName("m_name");
    //console.log("찾음: " + m_name.length);
    for(let i=0; i<names.length; i++){
      if(names[i].value.trim().length == 0){ //이름을 입력하지 않을경우
        alert('친구' + (i + 1) + '의 이름을 입력하세요!');
        // 해당 input에 포커스를 맞춘다.
        names[i].focus();
        // 함수를 즉시 종료하여 submit을 막는다.
        return;
      }
    }
    //폼에 있는 데이터를 서버로 보낸다.
    //document.forms[0].submit();
    frm.submit();
  }
</script>
</body>
</html>
